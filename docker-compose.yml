services:
  modo-carrera-fc:
    build:
      context: .
      dockerfile: Dockerfile
    image: modo-carrera-fc:latest
    container_name: modo-carrera-fc-app
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-3002}:80"
    environment:
      - NODE_ENV=production
      # IA local para ruedas de prensa, noticias y asistente (sin clave de Gemini)
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2}
    networks:
      - default
      - ia
    volumes:
      # Datos de carrera sincronizados entre dispositivos (un JSON por usuario)
      - ./data:/app/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Red del stack de IA (Ollama); si no existe, quita "ia" de networks del servicio
  ia:
    name: jarvis-stack_default
    external: true
